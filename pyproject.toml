[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "riffuna"
version = "0.1.4"
description = "Personal Windows music player"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "LICENSING.md", "LICENSES/*"]
requires-python = ">=3.12"
dependencies = [
  "PySide6==6.10.2",
  "yt-dlp[default]>=2026.10.21",
  "ytmusicapi>=1.12.3,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.16"]

[project.gui-scripts]
musicdesk = "musicdesk.__main__:main"

[tool.setuptools.packages.find]
include = ["musicdesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

