[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "riffuna"
version = "0.2.1"
description = "Training, evaluation and ONNX export tools for Riffuna"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "LICENSING.md", "LICENSES/*"]
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
evaluation = ["scipy>=1.13,<2", "implicit==0.7.3"]
recsys = ["torch>=2.5,<3", "catboost>=1.2,<2", "onnx>=1.17,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "redis>=5,<7", "qdrant-client>=1.13,<2"]

[tool.setuptools.packages.find]
include = ["riffuna_recsys*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

