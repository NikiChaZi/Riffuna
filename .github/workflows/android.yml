name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'shared/src/**', 'source-runtime/**', 'scripts/build_android*', 'scripts/check_*', '.github/workflows/android.yml', 'gradle/**', 'gradlew*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional new Android preview tag, for example v0.3.0-android.1'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: source-runtime/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore pinned source dependencies
        run: npm ci --prefix source-runtime --ignore-scripts
      - name: Build and check debug APK
        shell: pwsh
        run: ./scripts/check_ci_output.ps1 AndroidDebug
      - name: Prepare release signing
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.RIFFUNA_ANDROID_KEYSTORE_B64 }}
        run: |
          if [[ -z "$KEYSTORE_B64" ]]; then exit 0; fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/riffuna.jks"
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        shell: pwsh
        env:
          RIFFUNA_ANDROID_KEYSTORE: ${{ runner.temp }}/riffuna.jks
          RIFFUNA_ANDROID_KEY_PASSWORD: ${{ secrets.RIFFUNA_ANDROID_KEY_PASSWORD }}
        run: ./scripts/check_ci_output.ps1 AndroidRelease
      - name: Verify packages before upload
        run: python scripts/check_release_payload.py dist/android
      - uses: actions/upload-artifact@v4
        with:
          name: Riffuna-Android
          path: |
            dist/android/*.apk
            dist/android/*.sha256
          if-no-files-found: error
      - name: Remove temporary signing file
        if: always() && github.event_name != 'pull_request'
        run: rm -f "$RUNNER_TEMP/riffuna.jks"

  publish-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: Riffuna-Android
          path: dist/android
      - name: Verify downloaded packages
        run: python scripts/check_release_payload.py dist/android
      - name: Publish Android preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-android\.[0-9]+$ ]] || { echo 'Invalid Android preview tag'; exit 1; }
          test -f dist/android/Riffuna-android.apk
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A published release must not be overwritten. Choose a new version.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/android/Riffuna-android.apk dist/android/Riffuna-android.apk.sha256 --target "$GITHUB_SHA" --prerelease --title "Riffuna $RELEASE_TAG — Android" --notes-file docs/releases/android-preview.md
