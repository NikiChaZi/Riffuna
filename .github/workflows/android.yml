name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'shared/src/**', 'source-runtime/**', 'scripts/build_android*', '.github/workflows/android.yml', 'gradle/**', 'gradlew*']
  pull_request:
    paths: ['android/**', 'shared/src/**', 'source-runtime/**', 'scripts/build_android*', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional new Android preview tag, for example v0.3.0-android.1'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      HAS_SIGNING: ${{ secrets.RIFFUNA_ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: source-runtime/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore pinned source dependencies
        run: npm ci --prefix source-runtime --ignore-scripts
      - name: Build and check debug APK
        shell: pwsh
        run: ./scripts/build_android.ps1 -DebugBuild
      - name: Prepare release signing
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.RIFFUNA_ANDROID_KEYSTORE_B64 }}
        run: |
          umask 077
          mkdir -p .tools/ci-signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > .tools/ci-signing/riffuna.jks
      - name: Build signed release APK
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          RIFFUNA_ANDROID_KEYSTORE: ${{ github.workspace }}/.tools/ci-signing/riffuna.jks
          RIFFUNA_ANDROID_KEY_PASSWORD: ${{ secrets.RIFFUNA_ANDROID_KEY_PASSWORD }}
        run: ./scripts/build_android.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Riffuna-Android
          path: |
            dist/android/*.apk
            dist/android/*.sha256
          if-no-files-found: error
      - name: Publish Android preview
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-android\.[0-9]+$ ]] || { echo 'Invalid Android preview tag'; exit 1; }
          test -f dist/android/Riffuna-android.apk
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A published release must not be overwritten. Choose a new version.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/android/Riffuna-android.apk dist/android/Riffuna-android.apk.sha256 --target "$GITHUB_SHA" --prerelease --title "Riffuna $RELEASE_TAG — Android" --notes-file docs/releases/android-preview.md
      - name: Remove temporary signing file
        if: always()
        run: rm -f .tools/ci-signing/riffuna.jks
